{% extends "base.html" %}
{% block title %}El Híbrido Ganador - Panel{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">
    <h2 class="mb-1">Bienvenido, {{ current_user.usuario }}</h2>
    <p class="text-muted mb-4">Selecciona un módulo para gestionar.</p>

    <div class="row g-3">
        <div class="col-md-4">
            <a href="{{ url_for('productos') }}" class="text-decoration-none">
                <div class="card shadow-sm p-4 text-center h-100">
                    <i class="bi bi-box-seam fs-1 text-primary mb-2"></i>
                    <h5 class="mb-0">Productos</h5>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a href="{{ url_for('clientes') }}" class="text-decoration-none">
                <div class="card shadow-sm p-4 text-center h-100">
                    <i class="bi bi-people fs-1 text-primary mb-2"></i>
                    <h5 class="mb-0">Clientes</h5>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a href="{{ url_for('facturacion') }}" class="text-decoration-none">
                <div class="card shadow-sm p-4 text-center h-100">
                    <i class="bi bi-receipt fs-1 text-primary mb-2"></i>
                    <h5 class="mb-0">Facturación</h5>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
