<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}El Híbrido Ganador - Domótica y Redes{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Componente reutilizable: navbar -->
    {% include "components/navbar.html" %}

    <!-- Contenido dinámico -->
    {% block content %}{% endblock %}

    <footer class="text-center py-4 bg-dark text-white mt-5">
        <p class="mb-1 fw-bold">&copy; 2026 - Kevin Eduardo Galán Calderón</p>
        <p class="mb-0 small">Universidad Estatal Amazónica</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
